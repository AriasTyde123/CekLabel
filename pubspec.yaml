name: ceklabel
description: CekLabel - penerjemah label komposisi makanan (offline-first).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ingredients.json
    - assets/scanner/label-viewfinder.webp
    - assets/home/child.png
    - assets/home/father.png
    - assets/home/scanner.png
    - assets/home/oats.webp
    - assets/home/biscuits.webp
    - assets/home/milk.webp
    - assets/home/PlusJakartaSans-OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/home/plus-jakarta-400.ttf
          weight: 400
        - asset: assets/home/plus-jakarta-600.ttf
          weight: 600
        - asset: assets/home/plus-jakarta-700.ttf
          weight: 700
        - asset: assets/home/plus-jakarta-800.ttf
          weight: 800
